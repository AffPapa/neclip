name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-history:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every public ref
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/origin/pr/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Download pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_DARWIN_ARM64_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          GITLEAKS_DARWIN_X64_SHA256: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              expected="$GITLEAKS_DARWIN_ARM64_SHA256"
              ;;
            x86_64)
              archive="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              expected="$GITLEAKS_DARWIN_X64_SHA256"
              ;;
            *)
              echo "Unsupported macOS runner architecture" >&2
              exit 1
              ;;
          esac
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan publishable tree and full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: scripts/secret-scan.sh
