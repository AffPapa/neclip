name: Swift 6 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-6-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact dependencies
        run: swift package resolve
      - name: Public website and update coherence
        run: ruby scripts/verify-site.rb
      - name: Strict Swift 6 build
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Tests
        run: swift test
      - name: Strict release tests (app size optimization)
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
